description: 'Envision Energy is a Chinese green-technology company founded in 2007 by Lei Zhang and
  headquartered in Shanghai. It designs and manufactures smart wind turbines, operates one of the world''s
  largest fleets of connected wind and solar assets, and builds net-zero industrial parks. Its business
  spans energy storage and batteries (through Envision AESC), green hydrogen and green ammonia, and the
  EnOS AIoT operating system delivered by its Envision Digital arm, which connects and manages energy and
  IoT devices at scale. Envision was surfaced as a portfolio company of Hongshan (formerly Sequoia China)
  and added to the API Evangelist network for enrichment; its public digital surface is a marketing site
  and the EnOS platform, which is documented on region-restricted hosts not reachable for spec discovery
  in this pass.'
